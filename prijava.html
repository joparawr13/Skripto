</head>

<body>

    <!-- NAVIGACIJA -->
    <header>
        <nav class="navigacija">

            <a href="index.html" class="logo">Skripto<span>.</span></a>

            <div class="izbornik">

                <span class="trenutna_stranica">Moj profil</span>
            
                <button class="gumb_izbornik" id="gumbIzbornik" type="button"
                    aria-label="Otvori navigaciju" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            
                <ul class="izbornik_linkovi" id="izbornikLinkovi">
                    <li><a href="index.html">Početna</a></li>
                    <li><a href="skripte.html">Skripte</a></li>
                    <li><a href="o-nama.html">O nama</a></li>
                    <li><a href="upload.html">Pošalji skriptu</a></li>
                    <li><a href="kontakt.html">Kontakt</a></li>
                    <li><a href="profil.html">Moj profil</a></li>
                </ul>
            
            </div>

        </nav>
    </header>

<main>
    <div class="auth-container">

        <h1>Prijava</h1>

        <p class="auth-opis">
            Prijavi se na svoj Skripto račun.
        </p>

        <form class="auth-form" id="prijavaForma">

            <label for="email">E-mail adresa</label>
            <input
                type="email"
                id="email"
                placeholder="Unesi e-mail"
                required
            >

            <label for="lozinka">Lozinka</label>
            <input
                type="password"
                id="lozinka"
                placeholder="Unesi lozinku"
                required
            >

            <button type="submit" id="prijavaGumb">
                Prijavi se
            </button>

        </form>

        <p id="poruka"></p>

        <p class="auth-poruka">
            Nemaš račun?
            <a href="registracija.html">Registriraj se</a>
        </p>

    </div>
</main>
<script>
    // HAMBURGER NAVIGACIJA

    const gumbIzbornik = document.getElementById("gumbIzbornik");
    const izbornikLinkovi = document.getElementById("izbornikLinkovi");

    gumbIzbornik.addEventListener("click", function () {

        gumbIzbornik.classList.toggle("aktivno");
        izbornikLinkovi.classList.toggle("aktivno");

        const otvoren = izbornikLinkovi.classList.contains("aktivno");

        gumbIzbornik.setAttribute("aria-expanded", otvoren);
    });

    // Zatvaranje klikom izvan izbornika
    document.addEventListener("click", function (event) {

        if (!event.target.closest(".izbornik")) {
            gumbIzbornik.classList.remove("aktivno");
            izbornikLinkovi.classList.remove("aktivno");
            gumbIzbornik.setAttribute("aria-expanded", "false");
        }

    });

    // Zatvaranje nakon odabira stranice
    izbornikLinkovi.querySelectorAll("a").forEach(function (link) {

        link.addEventListener("click", function () {
            gumbIzbornik.classList.remove("aktivno");
            izbornikLinkovi.classList.remove("aktivno");
            gumbIzbornik.setAttribute("aria-expanded", "false");
        });

    });
</script>

import { createClient } from

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViY21wc2Vsc3N5a3dubml0cXJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NzA1ODAsImV4cCI6MjEwOTA0NjU4MH0.T8mRezFMw8eOajO5l8L6-6129b4Lt5Y66ZHRy0i_pzI";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const forma = document.getElementById("prijavaForma");
const poruka = document.getElementById("poruka");
const gumb = document.getElementById("prijavaGumb");

forma.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const lozinka = document.getElementById("lozinka").value;

    poruka.textContent = "";

    gumb.disabled = true;
    gumb.textContent = "Prijava u tijeku...";

    try {

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: lozinka
        });

        if (error) {
            throw error;
        }

        if (!data.session) {
            throw new Error("Prijava nije uspjela.");
        }

        poruka.textContent = "Uspješna prijava! Preusmjeravanje...";

        window.location.href = "index.html";

    } catch (error) {

        poruka.textContent = "Greška: " + error.message;

    } finally {

        gumb.disabled = false;
        gumb.textContent = "Prijavi se";

    }

});

</script>
